<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feature tracker</title>
<!--
  Feature Tracker renderer. Do NOT edit the markup or script below.
  Only replace the JSON inside <script id="tracker-state">. Escape "</" as "<\/".
-->
<style>
:root{
  --bg:#f7f6f3;--surface:#fff;--surface-2:#f0eee9;--text:#1c1b19;--muted:#6c685f;--border:#e2ded5;
  --accent:#3b5bdb;--accent-soft:#e8edfd;
  --good:#1f7a4d;--good-soft:#e2f3e9;--bad:#b3261e;--bad-soft:#fbe6e4;--warn:#9a6200;--warn-soft:#fcf0da;
  --info:#2c6fae;--info-soft:#e1edf8;--review:#7c3aed;--review-soft:#efe7fd;
  --s-backlog:#9a968d;--s-todo:#6b8bb3;--s-progress:#2c6fae;--s-review:#7c3aed;--s-done:#1f7a4d;--s-canceled:#b3261e;
  --e-props:#3b5bdb;--e-hook:#0f766e;--e-fetch:#be185d;--e-context:#7c3aed;--e-callback:#c2410c;--e-url:#4d7c0f;
  --code-bg:#f4f2ee;--radius:10px;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151513;--surface:#1e1e1b;--surface-2:#262521;--text:#ecebe6;--muted:#a19d94;--border:#34332e;
  --accent:#8ea4ff;--accent-soft:#232a45;--good:#5cc98f;--good-soft:#16301f;--bad:#ff8a80;--bad-soft:#3a1d1b;
  --warn:#f0b95c;--warn-soft:#3a2c12;--info:#7db8f0;--info-soft:#172a3d;--review:#c4a3ff;--review-soft:#2d2245;
  --s-backlog:#7d796f;--s-todo:#8aa6cc;--s-progress:#7db8f0;--s-review:#c4a3ff;--s-done:#5cc98f;--s-canceled:#ff8a80;
  --e-props:#8ea4ff;--e-hook:#5eead4;--e-fetch:#f472b6;--e-context:#c4a3ff;--e-callback:#fb923c;--e-url:#a3e635;--code-bg:#1a1a17;}}
:root[data-theme="dark"]{
  --bg:#151513;--surface:#1e1e1b;--surface-2:#262521;--text:#ecebe6;--muted:#a19d94;--border:#34332e;
  --accent:#8ea4ff;--accent-soft:#232a45;--good:#5cc98f;--good-soft:#16301f;--bad:#ff8a80;--bad-soft:#3a1d1b;
  --warn:#f0b95c;--warn-soft:#3a2c12;--info:#7db8f0;--info-soft:#172a3d;--review:#c4a3ff;--review-soft:#2d2245;
  --s-backlog:#7d796f;--s-todo:#8aa6cc;--s-progress:#7db8f0;--s-review:#c4a3ff;--s-done:#5cc98f;--s-canceled:#ff8a80;
  --e-props:#8ea4ff;--e-hook:#5eead4;--e-fetch:#f472b6;--e-context:#c4a3ff;--e-callback:#fb923c;--e-url:#a3e635;--code-bg:#1a1a17;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 var(--font)}
main{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:1.7rem;line-height:1.25;margin:4px 0 6px}
h2{font-size:1.25rem;margin:44px 0 10px;padding-top:10px;border-top:1px solid var(--border)}
h3{font-size:1rem;margin:22px 0 8px}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:.85em}
code{background:var(--code-bg);padding:1px 5px;border-radius:4px}
pre{font-family:var(--mono);font-size:.8rem;background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre;margin:8px 0}
.meta{color:var(--muted);font-size:.88rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.87rem}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.04em}
details{margin:8px 0}
summary{cursor:pointer;font-weight:600}
.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);margin:2px 4px 2px 0;white-space:nowrap}
.dim{opacity:.28}
.hl{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.progress{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--surface-2);margin:14px 0 6px}
.progress span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.st-backlog{--st:var(--s-backlog)}.st-todo{--st:var(--s-todo)}.st-progress{--st:var(--s-progress)}
.st-review{--st:var(--s-review)}.st-done{--st:var(--s-done)}.st-canceled{--st:var(--s-canceled)}
.filter{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--border)}
.filter select{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);max-width:100%}
.filter button{font:inherit;font-size:.85rem;padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 14px}
.stat b{display:block;font-size:1.1rem}.stat span{color:var(--muted);font-size:.78rem}
.notice{border-left:4px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0;font-size:.9rem}

/* DAG */
.dag-wrap{overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.dag{position:relative}
.dag svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.dag svg path{fill:none;stroke:var(--border);stroke-width:2}
.dag svg path.hl{stroke:var(--accent);outline:none}
.tnode{position:absolute;width:190px;height:78px;display:flex;flex-direction:column;gap:1px;background:var(--surface-2);border:1px solid var(--border);border-left:5px solid var(--st);border-radius:8px;padding:5px 8px;cursor:pointer;overflow:hidden;font-size:.78rem;line-height:1.3;text-align:left;color:var(--text);font-family:inherit}
.tnode .trow{display:flex;justify-content:space-between;align-items:center;gap:4px;white-space:nowrap}
.tnode .tid{font-family:var(--mono);font-size:.7rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.tnode .tst{font-size:.68rem;color:var(--st);font-weight:600;margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnode .tt{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tnode .tb{display:flex;gap:3px;flex:none}
.mini{font-size:.62rem;font-weight:700;padding:0 5px;border-radius:4px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.mini.rv-approve{color:var(--good);border-color:var(--good)}.mini.rv-comments{color:var(--warn);border-color:var(--warn)}
.mini.rv-changes{color:var(--bad);border-color:var(--bad)}.mini.stale{text-decoration:line-through}
.ext{font-size:.66rem;color:var(--warn)}

/* components */
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:14px;padding-left:14px;border-left:2px solid var(--border)}
.tree li{position:relative;padding:5px 0}
.tree ul>li::before{content:"";position:absolute;left:-14px;top:22px;width:12px;border-top:2px solid var(--border)}
.cnode{display:inline-block;min-width:220px;max-width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:6px 9px}
.cnode.planned{border-style:dashed;background:transparent}
.cnode.deleted .cname{text-decoration:line-through;color:var(--muted)}
.cname{font-family:var(--mono);font-weight:700;font-size:.85rem}
.cpath{display:block;font-family:var(--mono);font-size:.7rem;color:var(--muted);word-break:break-all}
.chg{display:inline-block;font-size:.66rem;font-weight:700;padding:0 6px;border-radius:4px;margin:2px 3px 0 0;border:1px solid currentColor}
.chg.created{color:var(--good)}.chg.edited{color:var(--warn)}.chg.deleted{color:var(--bad)}.chg.moved{color:var(--info)}
.chg.planned{color:var(--muted);border-style:dashed}
.chg.unconf{border-style:dashed;opacity:.8}
.edge{display:inline-block;font-family:var(--mono);font-size:.68rem;padding:0 6px;border-radius:4px;margin:3px 3px 0 0;border:1px solid currentColor}
.edge.ev-ticket{border-style:dashed;opacity:.85}
.e-props{color:var(--e-props)}.e-hook{color:var(--e-hook)}.e-fetch{color:var(--e-fetch)}
.e-context{color:var(--e-context)}.e-callback{color:var(--e-callback)}.e-url{color:var(--e-url)}.e-renders{color:var(--muted)}
.lane h4{margin:10px 0 4px;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.lane .cnode{display:block;margin:6px 0;min-width:0}

/* questions + reviews */
.q{border-left:4px solid var(--warn);background:var(--surface);border-top:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border);border-radius:0 8px 8px 0;padding:10px 14px;margin:10px 0}
.q.answered{border-left-color:var(--good)}
.q .qt{font-weight:600}
.q blockquote{margin:6px 0;padding:4px 10px;border-left:3px solid var(--border);color:var(--muted);font-size:.87rem}
.verdict{display:inline-block;font-weight:700;padding:3px 10px;border-radius:6px}
.verdict.approve{background:var(--good-soft);color:var(--good)}.verdict.comments{background:var(--warn-soft);color:var(--warn)}.verdict.changes{background:var(--bad-soft);color:var(--bad)}
.finding{border:1px solid var(--border);border-left-width:5px;border-radius:8px;padding:8px 12px;margin:8px 0;background:var(--surface)}
.finding.blocker{border-left-color:var(--bad)}.finding.major{border-left-color:var(--warn)}.finding.minor{border-left-color:var(--info)}.finding.nit{border-left-color:var(--border)}
.sev{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-right:6px}
.blocker .sev{color:var(--bad)}.major .sev{color:var(--warn)}.minor .sev{color:var(--info)}.nit .sev{color:var(--muted)}
.finding p{margin:3px 0}
.ac-met{color:var(--good);font-weight:700}.ac-not-met{color:var(--bad);font-weight:700}.ac-cant-verify,.ac-not-reviewed{color:var(--muted);font-weight:700}
.empty{color:var(--muted);font-style:italic}
.tk{font-size:.66rem;font-weight:700;padding:0 6px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.tk-match{color:var(--good)}.tk-token-mismatch,.tk-value-mismatch,.tk-hardcoded{color:var(--bad)}
.tk-untokenized-figma{color:var(--warn)}.tk-missing-in-code,.tk-not-in-figma{color:var(--info)}.tk-cant-verify{color:var(--muted);border-style:dashed}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--border);vertical-align:middle;margin-right:4px}
.tkv{font-family:var(--mono);font-size:.74rem}.tkv small{display:block;color:var(--muted)}
</style>
</head>
<body>
<main id="app"><p class="empty">Loading tracker…</p></main>

<script type="application/json" id="tracker-state">
{"version":1,"meta":{"parentId":"PARENT-1","parentTitle":"Example parent","lastSynced":"2026-01-01T00:00:00Z"},"tickets":[],"components":[],"edges":[],"questions":[]}
</script>

<script>
(function(){
"use strict";
var S;
try { S = JSON.parse(document.getElementById("tracker-state").textContent); }
catch(e){ document.getElementById("app").textContent = "Tracker state is invalid JSON: " + e.message; return; }
S.tickets = S.tickets || []; S.components = S.components || []; S.edges = S.edges || []; S.questions = S.questions || [];
var meta = S.meta || {};
var filter = "all";

function h(tag, attrs){
  var n = document.createElement(tag);
  if (attrs) for (var k in attrs){
    if (attrs[k] == null || attrs[k] === false) continue;
    if (k === "text") n.textContent = attrs[k];
    else if (k === "on") for (var ev in attrs.on) n.addEventListener(ev, attrs.on[ev]);
    else n.setAttribute(k, attrs[k]);
  }
  function add(c){
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(add); return; }
    n.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  }
  for (var i = 2; i < arguments.length; i++) add(arguments[i]);
  return n;
}
function link(url, text){ return url ? h("a", {href:url, target:"_blank", rel:"noopener", text:text}) : h("span", {text:text}); }
function fmtDate(s){ if(!s) return "—"; var d = new Date(s); return isNaN(d) ? s : d.toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"}); }
var byId = {}; S.tickets.forEach(function(t){ byId[t.id] = t; });
function tLabel(id){ var t = byId[id]; return t ? (t.number ? t.number + " · " : "") + id : id; }

function statusGroup(t){
  var ty = (t.statusType||"").toLowerCase(), nm = (t.status||"").toLowerCase();
  if (ty === "completed") return "done";
  if (ty === "canceled") return "canceled";
  if (ty === "started") return /review/.test(nm) ? "review" : "progress";
  if (ty === "unstarted") return "todo";
  return "backlog";
}
var GROUPS = [["done","Done"],["review","In review"],["progress","In progress"],["todo","Todo"],["backlog","Backlog"],["canceled","Canceled"]];

function ticketMatches(id){ return filter === "all" || id === filter; }
function compTouched(c){ return filter === "all" || (c.changes||[]).some(function(ch){ return ch.ticket === filter; }); }
function edgeTouched(e){ return filter === "all" || e.ticket === filter; }
function qTouched(q){ return filter === "all" || (q.tickets||[]).indexOf(filter) >= 0 || (q.sources||[]).some(function(s){ return s.ticket === filter; }); }

function render(){
  var app = document.getElementById("app"); app.innerHTML = "";
  document.title = "Tracker · " + (meta.parentId||"") + " · " + (meta.parentTitle||"");
  app.appendChild(header());
  app.appendChild(filterBar());
  if (S.changelog && S.changelog.items && S.changelog.items.length) app.appendChild(changelog());
  app.appendChild(section("map","Ticket map", dag()));
  app.appendChild(section("components","Components & data flow", components()));
  app.appendChild(section("changes","Changes by ticket", changeTable()));
  app.appendChild(section("questions","Open questions", questions()));
  app.appendChild(section("reviews","Code reviews", reviews()));
  app.appendChild(section("tickets","Ticket details", ticketDetails()));
}
function section(id, title, body){ return h("section", {id:id}, h("h2", {text:title}), body); }

function header(){
  var counts = {}; GROUPS.forEach(function(g){ counts[g[0]] = 0; });
  S.tickets.forEach(function(t){ counts[statusGroup(t)]++; });
  var total = S.tickets.length || 1;
  var bar = h("div", {class:"progress", role:"img", "aria-label":"Ticket status breakdown"});
  var leg = h("div", {class:"legend"});
  GROUPS.forEach(function(g){
    if (!counts[g[0]]) return;
    bar.appendChild(h("span", {class:"st-"+g[0], style:"width:"+(100*counts[g[0]]/total)+"%;background:var(--st)"}));
    leg.appendChild(h("span", {class:"st-"+g[0]}, h("span",{class:"dot",style:"background:var(--st)"}), g[1] + " " + counts[g[0]]));
  });
  var comps = S.components.length, openQ = S.questions.filter(function(q){ return q.status !== "answered"; }).length;
  var reviewed = S.tickets.filter(function(t){ return t.review; }).length;
  var notInspected = S.tickets.filter(function(t){ return t.code === "not-inspected"; });
  var box = h("header", null,
    h("div", {class:"meta"}, link(meta.parentUrl, meta.parentId||""), meta.parentStatus ? " · " + meta.parentStatus : "", meta.integrationBranch ? [" · ", h("code",{text:meta.integrationBranch})] : null),
    h("h1", {text:meta.parentTitle || "Feature tracker"}),
    h("div", {class:"meta"}, "Last synced " + fmtDate(meta.lastSynced) + (meta.environment ? " · from " + meta.environment : ""),
      (meta.figma||[]).map(function(f){ return [" · ", link(f.url, "Figma: " + f.title)]; })),
    bar, leg,
    h("div", {class:"stats"},
      h("div",{class:"stat"}, h("b",{text:String(S.tickets.length)}), h("span",{text:"sub-tickets"})),
      h("div",{class:"stat"}, h("b",{text:String(comps)}), h("span",{text:"units tracked"})),
      h("div",{class:"stat"}, h("b",{text:String(openQ)}), h("span",{text:"open questions"})),
      h("div",{class:"stat"}, h("b",{text:String(reviewed)}), h("span",{text:"reviewed"}))));
  if (notInspected.length) box.appendChild(h("div",{class:"notice"},
    "Code not inspected for " + notInspected.map(function(t){ return tLabel(t.id); }).join(", ") +
    ". Components for these tickets come from ticket text only and are shown as planned."));
  return box;
}

function filterBar(){
  var sel = h("select", {"aria-label":"Filter by ticket", on:{change:function(){ filter = sel.value; render(); var s=document.querySelector(".filter select"); if(s) s.focus(); }}},
    h("option",{value:"all",text:"All tickets"}),
    S.tickets.map(function(t){ var o = h("option",{value:t.id,text:tLabel(t.id)+" — "+t.title}); if (t.id===filter) o.selected = true; return o; }));
  return h("div",{class:"filter"}, h("strong",{text:"Focus:"}), sel,
    filter !== "all" ? h("button",{type:"button",text:"Clear",on:{click:function(){ filter="all"; render(); }}}) : null,
    h("span",{class:"meta"}, h("a",{href:"#map",text:"Map"}), " · ", h("a",{href:"#components",text:"Components"}), " · ", h("a",{href:"#questions",text:"Questions"}), " · ", h("a",{href:"#reviews",text:"Reviews"})));
}

function changelog(){
  return h("div",{class:"card",style:"margin-top:16px"},
    h("strong",{text:"Since last sync"}), S.changelog.since ? h("span",{class:"meta",text:" (" + fmtDate(S.changelog.since) + ")"}) : null,
    h("ul",null, S.changelog.items.map(function(i){ return h("li",{text:i}); })));
}

/* ---------- ticket DAG ---------- */
function dag(){
  if (!S.tickets.length) return h("p",{class:"empty",text:"No sub-tickets."});
  var W=190,H=78,GX=56,GY=14,depth={};
  function blockers(t){ return (t.blockedBy||[]).map(function(b){ return typeof b === "string" ? b : b.id; }).filter(function(id){ return byId[id]; }); }
  function d(id, seen){
    if (depth[id] != null) return depth[id];
    if (seen[id]) return 0; seen[id] = true;
    var bs = blockers(byId[id]); var v = 0;
    bs.forEach(function(b){ v = Math.max(v, d(b, seen) + 1); });
    depth[id] = v; return v;
  }
  S.tickets.forEach(function(t){ d(t.id, {}); });
  var cols = {}; S.tickets.forEach(function(t){ (cols[depth[t.id]] = cols[depth[t.id]] || []).push(t); });
  var pos = {}, maxRows = 0, ncols = 0;
  Object.keys(cols).forEach(function(c){ ncols = Math.max(ncols, +c+1); cols[c].forEach(function(t,i){ pos[t.id] = {x:+c*(W+GX), y:i*(H+GY)}; }); maxRows = Math.max(maxRows, cols[c].length); });
  var width = ncols*(W+GX)-GX, height = maxRows*(H+GY)-GY;
  var wrap = h("div",{class:"dag",style:"width:"+width+"px;height:"+height+"px"});
  var NS="http://www.w3.org/2000/svg", svg=document.createElementNS(NS,"svg");
  svg.setAttribute("width",width); svg.setAttribute("height",height); svg.setAttribute("aria-hidden","true");
  S.tickets.forEach(function(t){
    blockers(t).forEach(function(b){
      var a=pos[b], z=pos[t.id]; if(!a||!z) return;
      var x1=a.x+W, y1=a.y+H/2, x2=z.x, y2=z.y+H/2, mx=(x1+x2)/2;
      var p=document.createElementNS(NS,"path");
      p.setAttribute("d","M"+x1+","+y1+" C"+mx+","+y1+" "+mx+","+y2+" "+x2+","+y2);
      if (filter!=="all" && (filter===t.id||filter===b)) p.setAttribute("class","hl");
      svg.appendChild(p);
    });
  });
  wrap.appendChild(svg);
  S.tickets.forEach(function(t){
    var g = statusGroup(t), p = pos[t.id];
    var badges = h("span",{class:"tb"});
    if (t.review) badges.appendChild(h("span",{class:"mini rv-"+t.review.verdict+(t.review.stale?" stale":""),title:"Reviewed"+(t.review.stale?" (stale: new commits)":""),text:"CR"}));
    if (t.code==="not-inspected") badges.appendChild(h("span",{class:"mini",title:"Code not inspected",text:"?"}));
    (t.prs||[]).forEach(function(pr){ badges.appendChild(h("span",{class:"mini",title:"PR "+pr.state,text:"#"+pr.number})); });
    var cls = "tnode st-"+g + (filter!=="all" && filter!==t.id ? " dim":"") + (filter===t.id ? " hl":"");
    wrap.appendChild(h("button",{type:"button",class:cls,style:"left:"+p.x+"px;top:"+p.y+"px",title:t.status,
      on:{click:function(){ filter = filter===t.id ? "all" : t.id; render(); }}},

/* ---------- components ---------- */
var compById = {}; S.components.forEach(function(c){ compById[c.id] = c; });

  var out = S.edges.filter(function(e){ return e.from===c.id && e.kind!=="renders"; });

    h("span",{class:"cname",text:c.name||c.id}), c.clientServer ? h("span",{class:"chip",text:c.clientServer}) : null,

      return h("span",{class:"chg "+ch.type+(u?" unconf":""), title:(ch.evidence?"evidence: "+ch.evidence:"")+(ch.note?" · "+ch.note:""), text:ch.type+(u?" (per ticket)":"")+" · "+tLabel(ch.ticket)}); })),
    out.length ? h("div",null,out.map(function(e){
      return h("span",{class:"edge e-"+e.kind+" ev-"+(e.evidence||"code")+(edgeTouched(e)?"":" dim"), title:(e.evidence==="ticket"?"planned in ticket":"seen in code")+(e.ticket?" · "+tLabel(e.ticket):""),
        text:e.kind+" → "+((compById[e.to]&&compById[e.to].name)||e.to)+(e.label?": "+e.label:"")}); })) : null,
    c.note ? h("div",{class:"meta",text:c.note}) : null);
}
function components(){
  if (!S.components.length) return h("p",{class:"empty",text:"No components recorded yet."});
  var ui = S.components.filter(function(c){ return c.kind==="route"||c.kind==="component"; });
  var data = S.components.filter(function(c){ return !(c.kind==="route"||c.kind==="component"); });
  var kids = {}, roots = [];
  // parents come from c.parent, else from a renders edge
  ui.forEach(function(c){
    var p = c.parent;
    if (!p){ var re = S.edges.filter(function(e){ return e.kind==="renders" && e.to===c.id; })[0]; if (re) p = re.from; }
    if (p && compById[p] && p!==c.id) (kids[p]=kids[p]||[]).push(c); else roots.push(c);
  });
  function branch(c, seen){
    if (seen[c.id]) return h("li",null,h("span",{class:"meta",text:"↻ "+c.id}));
    seen[c.id]=true;
    var li = h("li",null,cnode(c));
    if (kids[c.id]) li.appendChild(h("ul",null,kids[c.id].map(function(k){ return branch(k, Object.assign({},seen)); })));
    return li;
  }
  var tree = h("ul",{class:"tree"}, roots.map(function(r){ return branch(r,{}); }));
  var lanes = h("div",{class:"lane"});
  [["hook","Hooks"],["fetcher","Fetchers"],["fixture","Fixtures"],["types","Types & contracts"],["util","Utilities"]].forEach(function(k){
    var items = data.filter(function(c){ return c.kind===k[0]; }); if (!items.length) return;

      if (users.length) node.appendChild(h("div",{class:"meta"},"used by ", users.map(function(e,i){
        return [i?", ":"", h("span",{class:"mono",text:(compById[e.from]&&compById[e.from].name)||e.from})]; })));
      lanes.appendChild(node);
    });
  });
  var legend = h("div",{class:"legend",style:"margin:6px 0 12px"},
    ["props","hook","fetch","context","callback","url"].map(function(k){ return h("span",{class:"edge e-"+k,text:k}); }),
    h("span",null,h("span",{class:"chg created",text:"created"}),h("span",{class:"chg edited",text:"edited"}),h("span",{class:"chg deleted",text:"deleted"}),h("span",{class:"chg moved",text:"moved"}),h("span",{class:"chg planned",text:"planned"})),
    h("span",{text:"Dashed = from ticket text only, not confirmed in code"}));
  return h("div",null, legend, h("div",{class:"cols"},
    h("div",{class:"card scroll"}, h("h3",{style:"margin-top:0",text:"Render tree"}), tree),
    h("div",{class:"card"}, h("h3",{style:"margin-top:0",text:"Data layer"}), lanes.childNodes.length ? lanes : h("p",{class:"empty",text:"No hooks, fetchers or fixtures recorded."}))));
}

/* ---------- change table ---------- */
function changeTable(){
  var rows = S.tickets.filter(function(t){ return ticketMatches(t.id); }).map(function(t){
    var c = {created:0,edited:0,deleted:0,moved:0,planned:0};
    S.components.forEach(function(k){ (k.changes||[]).forEach(function(ch){ if (ch.ticket===t.id && c[ch.type]!=null) c[ch.type]++; }); });

/* ---------- questions ---------- */
function qCard(q){

    h("div",null, h("span",{class:"chip",text:q.kind||"open"}), q.raised ? h("span",{class:"meta",text:" raised "+q.raised}) : null),
    h("div",{class:"qt",text:q.text}),

function questions(){
  var qs = S.questions.filter(qTouched);
  var open = qs.filter(function(q){ return q.status!=="answered"; }), done = qs.filter(function(q){ return q.status==="answered"; });

/* ---------- reviews ---------- */
function reviews(){
  var ts = S.tickets.filter(function(t){ return t.review && ticketMatches(t.id); });
  if (!ts.length) return h("p",{class:"empty",text:"No reviews yet. Reviews run only when you ask for a specific sub-ticket."});
  var V = {approve:"Approve",comments:"Approve with comments",changes:"Request changes"};
  return h("div",null, ts.map(function(t){
    var r = t.review, counts = {};
    (r.findings||[]).forEach(function(f){ counts[f.severity]=(counts[f.severity]||0)+1; });
    return h("div",{class:"card",style:"margin:12px 0"},
      h("h3",{style:"margin-top:0"}, link(t.url, tLabel(t.id)+" — "+t.title)),
      h("div",null, h("span",{class:"verdict "+r.verdict,text:V[r.verdict]||r.verdict}),
        h("span",{class:"meta",text:"  "+["blocker","major","minor","nit"].filter(function(s){return counts[s];}).map(function(s){return counts[s]+" "+s;}).join(" · ")})),
      h("div",{class:"meta"}, "Reviewed "+fmtDate(r.reviewedAt)+" with "+r.reviewer+(r.pr?" · PR #"+r.pr:"")+(r.sha?" @ ":""), r.sha ? h("code",{text:r.sha}) : null),
      r.stale ? h("div",{class:"notice",text:"New commits since this review. Ask for a re-review if needed."}) : null,
      r.summary ? h("p",{text:r.summary}) : null,
      (r.findings||[]).map(function(f){ return h("div",{class:"finding "+f.severity},
        h("div",null,h("span",{class:"sev",text:f.severity}),h("strong",{text:f.title}), f.location ? h("span",{class:"meta"}," ",h("code",{text:f.location})) : null),
        f.finding ? h("p",{text:f.finding}) : null,
        f.why ? h("p",null,h("b",{text:"Why it matters: "}),f.why) : null,
        f.suggestion ? h("p",null,h("b",{text:"Suggestion: "}),f.suggestion) : null,
        f.snippet ? h("pre",{text:f.snippet}) : null); }),
      acceptance(t),
      tokenAudit(r.tokenAudit),
      r.raw ? h("details",null,h("summary",{text:"Raw reviewer output"}),h("pre",{text:r.raw})) : null);
  }));
}
function acceptance(t){

  return h("details",{open:"open"}, h("summary",{text:"Acceptance criteria"}), h("div",{class:"scroll"}, h("table",null,
    h("tr",null,h("th",{text:"Criterion"}),h("th",{text:"Linear"}),h("th",{text:"Verified"}),h("th",{text:"Note"})),
    t.acceptance.map(function(a){ var v=a.verified||"not-reviewed"; return h("tr",null,h("td",{text:a.text}),h("td",{text:a.checkedInLinear?"☑":"☐"}),h("td",{class:"ac-"+v,text:L[v]||v}),h("td",{class:"meta",text:a.note||""})); }))));
}

function tokenAudit(a){
  if (!a) return h("p",{class:"notice",text:"No design-token audit recorded for this review."});
  if (a.status==="not-audited") return h("div",{class:"notice",text:"Design tokens not audited: "+(a.reason||"no reason given")});
  var items=a.items||[], counts={};
  items.forEach(function(i){ counts[i.status]=(counts[i.status]||0)+1; });
  var ORDER=["hardcoded","token-mismatch","value-mismatch","untokenized-figma","missing-in-code","not-in-figma","cant-verify","match"];
  var LBL={"match":"match","token-mismatch":"token mismatch","value-mismatch":"value mismatch","hardcoded":"hardcoded","untokenized-figma":"untokenized in Figma","missing-in-code":"missing in code","not-in-figma":"not in Figma","cant-verify":"can't verify"};
  function isColor(v){ return typeof v==="string" && /^(#[0-9a-f]{3,8}|rgba?\(|hsla?\()/i.test(v.trim()); }

      .sort(function(x,y){ return ORDER.indexOf(x.status)-ORDER.indexOf(y.status); });

    var bad=rows.filter(function(r){ return r.status!=="match"; }).length;
    body.appendChild(h("h4",{style:"margin:12px 0 4px;text-transform:capitalize",text:c+" · "+(rows.length-bad)+"/"+rows.length+" match"}));
    body.appendChild(h("div",{class:"scroll"},h("table",null,
      h("tr",null,["Element","Figma","Code","Status","Note"].map(function(x){ return h("th",{text:x}); })),
      rows.map(function(r){ return h("tr",null,
        h("td",null, r.element, r.property?h("div",{class:"meta",text:r.property+(r.breakpoint?" · "+r.breakpoint:"")}):null, r.location?h("div",null,h("code",{text:r.location})):null),
        h("td",null,side(r.figma)), h("td",null,side(r.code)),
        h("td",null,h("span",{class:"tk tk-"+r.status,text:LBL[r.status]||r.status}), r.matchedBy==="value"?h("div",{class:"meta",text:"matched by value"}):null),
        h("td",{class:"meta"}, r.note||"", r.question?[" ",h("a",{href:"#q-"+r.question,text:"→ question"})]:null)); }))));
  });
  return h("details",{open:"open"},
    h("summary",null,"Design-token audit (Figma vs code)  ",
      ORDER.filter(function(k){ return counts[k]; }).map(function(k){ return h("span",{class:"tk tk-"+k,style:"margin-left:4px",text:counts[k]+" "+LBL[k]}); })),
    a.status==="partial"?h("div",{class:"notice",text:"Partial audit: "+(a.reason||"")}):null,

      (a.tokenSources||[]).length?[" · Tokens read from ", a.tokenSources.map(function(t,i){ return [i?", ":"",h("code",{text:t})]; })]:null),
    body);
}

/* ---------- ticket details ---------- */
function ticketDetails(){

    var d = h("details",{class:"card",style:"margin:8px 0"}, h("summary",null, tLabel(t.id)+" — "+t.title+"  ", h("span",{class:"chip",text:t.status})),

      (t.externalBlockers||[]).length ? h("p",{text:"External: "+t.externalBlockers.join(", ")}) : null,

      t.codeNote ? h("p",{class:"meta",text:t.codeNote}) : null,
